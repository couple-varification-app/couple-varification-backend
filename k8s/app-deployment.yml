apiVersion: apps/v1
kind: Deployment
metadata:
  name: couple-verification-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: couple-verification-backend
  template:
    metadata:
      labels:
        app: couple-verification-backend
    spec:
      containers:
        - name: couple-verification-backend
          image: yourdockerhubusername/couple-verification-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/couple_db
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couple-verification-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: couple-verification-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: couple-verification-service
spec:
  type: LoadBalancer
  selector:
    app: couple-verification-backend
  ports:
    - port: 80
      targetPort: 8080