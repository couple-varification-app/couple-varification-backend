spring.application.name=Relationship_platform



# ===========================================
# APPLICATION PROPERTIES - RELATIONSHIP PLATFORM
# ===========================================

# Server Configuration
server.port=8080

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/couple_db
spring.datasource.username=root
spring.datasource.password=ritesh02
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===========================================
# JWT CONFIGURATION
# ===========================================
# IMPORTANT: Change this secret in production!
# Must be at least 256 bits (32 characters)
jwt.secret=mySecretKeyForRelationshipPlatformThatIsAtLeast256BitsLong12345678

# JWT expiration time in milliseconds
# 86400000 ms = 24 hours
# 604800000 ms = 7 days
# 2592000000 ms = 30 days
jwt.expiration=86400000

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.root=INFO
logging.level.com.relationshipplatform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# VALIDATION CONFIGURATION
# ===========================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===========================================
# ERROR HANDLING
# ===========================================
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# ===========================================
# CORS CONFIGURATION (if needed for frontend)
# ===========================================
# Uncomment and configure for your frontend URL
# cors.allowed-origins=http://localhost:3000
# cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# cors.allowed-headers=*

# ===========================================
# ACTUATOR CONFIGURATION (Optional)
# ===========================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always